<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 388 386" width="388" height="386">
  <title>汕头一中八五足球队</title>

  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d1d1f"/>
      <stop offset="50%" stop-color="#2c2c2e"/>
      <stop offset="100%" stop-color="#1d1d1f"/>
    </linearGradient>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <radialGradient id="ballGrad" cx="35%" cy="35%">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </radialGradient>
  </defs>

  <!-- 背景圆环 -->
  <circle cx="194" cy="193" r="190" fill="url(#bgGrad)" stroke="#4a90e2" stroke-width="3"/>
  <circle cx="194" cy="193" r="178" fill="none" stroke="rgba(74,144,226,0.4)" stroke-width="1"/>

  <!-- 内圈装饰 -->
  <circle cx="194" cy="193" r="140" fill="rgba(34,197,94,0.08)" stroke="rgba(34,197,94,0.4)" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- 主徽章（盾形） -->
  <g transform="translate(194,193)">
    <!-- 盾形外框 -->
    <path d="M -90 -85 L 90 -85 L 90 30 Q 90 75 0 100 Q -90 75 -90 30 Z"
          fill="url(#crestGrad)" opacity="0.95" stroke="#fff" stroke-width="2"/>

    <!-- "八五"大字 -->
    <text x="0" y="-15" font-family="'Ma Shan Zhong', 'STKaiti', 'KaiTi', cursive"
          font-size="64" font-weight="900" text-anchor="middle"
          fill="#fafafa" stroke="#14532d" stroke-width="1">八五</text>

    <!-- "足球队" 小字 -->
    <text x="0" y="22" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="20" font-weight="700" text-anchor="middle"
          fill="#fafafa" letter-spacing="6">足球队</text>

    <!-- "1985" 数字 -->
    <text x="0" y="65" font-family="'Helvetica Neue', sans-serif"
          font-size="14" font-weight="600" text-anchor="middle"
          fill="#fbbf24" letter-spacing="2">EST. 1985</text>
  </g>

  <!-- 足球图标（左下） -->
  <g transform="translate(85,290)">
    <circle r="28" fill="url(#ballGrad)" stroke="#1d1d1f" stroke-width="1.5"/>
    <!-- 五边形拼接 -->
    <polygon points="-2,-18 -8,-9 3,-5 8,-12" fill="#1d1d1f"/>
    <polygon points="0,18 -8,9 3,5 -5,15" fill="#1d1d1f" opacity="0.7"/>
    <polygon points="14,-3 8,7 -2,2 5,-10" fill="#1d1d1f" opacity="0.7"/>
    <circle r="1" cy="-18" cx="0" fill="#1d1d1f"/>
  </g>

  <!-- 足球图标（右上） -->
  <g transform="translate(303,290)">
    <circle r="22" fill="url(#ballGrad)" stroke="#1d1d1f" stroke-width="1.5"/>
    <polygon points="-2,-14 -6,-7 2,-4 6,-9" fill="#1d1d1f"/>
    <polygon points="0,14 -6,7 2,4 -4,11" fill="#1d1d1f" opacity="0.7"/>
  </g>

  <!-- 顶部环文字 "SHANTOU NO.1 MIDDLE SCHOOL" -->
  <defs>
    <path id="topArc" d="M 40 193 A 154 154 0 0 1 348 193" fill="none"/>
  </defs>
  <text font-family="'Helvetica Neue', sans-serif" font-size="14" font-weight="700"
        fill="rgba(255,255,255,0.85)" letter-spacing="3">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      SHANTOU NO.1 MIDDLE SCHOOL • CLASS 1985 •
    </textPath>
  </text>

  <!-- 副标题（底部） -->
  <text x="194" y="370" font-family="'PingFang SC', sans-serif"
        font-size="14" font-weight="500" text-anchor="middle"
        fill="rgba(255,255,255,0.7)" letter-spacing="2">因为热爱 · 所以坚持</text>
</svg>
